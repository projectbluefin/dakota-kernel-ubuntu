name: dakota-kernel-ubuntu
min-version: '2.5'
element-path: elements

(@):
- dakota.bst:freedesktop-sdk.bst:include/runtime.yml

# Reuse the pinned toolchain and configuration that passed the Ghost build.
options:
  arch:
    type: arch
    description: Kernel architecture
    variable: arch
    values:
    - x86_64
  x86_64_v3:
    type: bool
    description: Enable x86-64-v3 optimizations
    default: false

sandbox:
  build-arch: '%{arch}'

variables:
  go-arch: amd64

plugins:
- origin: junction
  junction: plugins/buildstream-plugins-community.bst
  sources:
  - git_repo
- origin: junction
  junction: dakota.bst:plugins/buildstream-plugins.bst
  elements:
  - make

junctions:
  internal:
  - plugins/buildstream-plugins-community.bst

sources:
  git_repo:
    config:
      ref-format: git-describe

aliases:
  github: https://github.com/
  launchpad: https://git.launchpad.net/
  pypi: https://files.pythonhosted.org/packages/
