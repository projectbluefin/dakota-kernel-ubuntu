name: dakota-kernel-ubuntu
min-version: '2.5'
element-path: elements

# Reuse the exact kernel recipe and toolchain that passed the Ghost build.
options:
  arch:
    type: arch
    description: Kernel architecture
    variable: arch
    values:
    - x86_64

sandbox:
  build-arch: '%{arch}'

variables:
  go-arch: amd64

plugins:
- origin: junction
  junction: plugins/buildstream-plugins-community.bst
  sources:
  - git_repo

sources:
  git_repo:
    config:
      ref-format: git-describe

aliases:
  github: https://github.com/
  pypi: https://files.pythonhosted.org/packages/
