name: Validate Dakota kernel consumer

on:
  workflow_dispatch:
    inputs:
      dakota_ref:
        description: Exact Dakota commit to validate
        required: true
        default: d73e4b2ffcd7cb19b02372ea8f771d3ed4086a43
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Require an immutable consumer revision
        env:
          DAKOTA_REF: ${{ inputs.dakota_ref }}
        run: '[[ "$DAKOTA_REF" =~ ^[0-9a-f]{40}$ ]]'
      - name: Checkout exact Dakota consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: projectbluefin/dakota
          ref: ${{ inputs.dakota_ref }}
          persist-credentials: false
      - name: Setup hosted validation runner
        uses: projectbluefin/actions/bootc-build/setup-runner@a52da5670b9337598cbc80c4d6a9a7b21e770aec # v1
        with:
          storage-backend: btrfs
          update-podman: true
          native-overlay: true
          install-tools: '["just"]'
      - name: Run complete Dakota validation gate
        run: |
          set -euo pipefail
          mkdir -p logs
          just validate 2>&1 | tee logs/consumer-validation.log
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consumer-validation-logs
          path: logs/
          if-no-files-found: warn
          retention-days: 14
